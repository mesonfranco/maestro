appId: com.vblast.flipaclip
env:
  PROJECT_NAME: "Project edited"
---
- launchApp: com.vblast.flipaclip
- extendedWaitUntil:
    visible: "My Project Layout 3"
    timeout: 5000
- longPressOn: "My Project Layout 3"
- tapOn: "Edit"
- repeat:
    times: 2
    commands:
      - tapOn: "Name your animation"
- tapOn:
    id: "insertion_handle"
- tapOn: "Select all"
- eraseText
- inputText: ${PROJECT_NAME}
- tapOn: "Back"
- tapOn: "YouTube (720p)"
- tapOn: "Vimeo (1080p)"
- tapOn: "Back"
- tapOn:
    id: "actionFps"
- scroll
- swipe:
    from: 12
    direction: UP
    duration: 1000
- swipe:
    from: 23
    direction: UP
- tapOn: "30"
- tapOn: "Back"
- tapOn: "SAVE CHANGES"
- assertVisible: "Project edited"
- assertVisible: "30 fps"